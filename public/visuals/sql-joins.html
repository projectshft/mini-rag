<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Joins: which rows survive? · Parsity</title>
<style>
  :root{--ink:#1b2330;--muted:#5b6675;--line:#e3e7ec;--bg:#fff;--panel:#f6f8fa;
        --accent:#2563eb;--accent-bg:#eef4ff;--good:#15803d;--good-bg:#e7f6ec;--warn:#b91c1c;--warn-bg:#fbe9e9;
        --amber:#b45309;--amber-bg:#fef3e2;--code-bg:#f4f6f8;}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);margin:0;padding:1.6rem;line-height:1.5}
  h1{font-size:1.5rem;margin:0 0 .3rem}
  h2{font-size:1.02rem;margin:0 0 .5rem}
  .lead{color:var(--muted);font-size:1.02rem;max-width:62rem;margin:0 0 1rem}
  .controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:0 0 1rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .controls .lbl{font-size:.85rem;color:var(--muted);margin-right:.2rem}
  .pills{display:flex;gap:.4rem;flex-wrap:wrap}
  button{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.4rem .8rem;border-radius:999px}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}
  .col{flex:1 1 320px;min-width:280px}
  .card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:.9rem 1rem;margin-bottom:.8rem}
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:.9rem 1rem;margin-bottom:.8rem}
  .flow{display:flex;gap:.4rem;flex-wrap:wrap;align-items:stretch;margin:0 0 1rem}
  .node{flex:1 1 96px;min-width:92px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:.5rem .55rem;font-size:.84rem;text-align:center;transition:all .15s}
  .node b{display:block;font-size:.82rem;overflow-wrap:anywhere}
  .node small{color:var(--muted)}
  .node.active{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .node.done{border-color:#b7dfc4;background:var(--good-bg)}
  .node.fail{border-color:#f0c4c4;background:var(--warn-bg)}
  .node.skip{opacity:.4}
  .arrow{align-self:center;color:var(--muted);font-size:.9rem}
  .tag{display:inline-block;padding:.05em .5em;border-radius:999px;font-size:.78rem;font-weight:600}
  .tag.good{color:var(--good);background:var(--good-bg)} .tag.bad{color:var(--warn);background:var(--warn-bg)}
  .tag.info{color:var(--accent);background:var(--accent-bg)} .tag.amber{color:var(--amber);background:var(--amber-bg)}
  .verdict{padding:.7rem .9rem;border-radius:10px;font-size:.95rem;margin:.6rem 0 0}
  .verdict.good{background:var(--good-bg);color:var(--good)} .verdict.bad{background:var(--warn-bg);color:var(--warn)}
  .verdict.info{background:var(--accent-bg);color:#1e40af}
  code,pre{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.86rem}
  code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.4rem 0;overflow:auto;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em}
  td.null{color:var(--warn);font-style:italic;background:var(--warn-bg)}
  tr.hit td{background:var(--accent-bg)}
  .muted{color:var(--muted)} .small{font-size:.86rem}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;padding:.35rem .5rem .35rem 2rem;position:relative;border-radius:8px;font-size:.9rem;cursor:pointer;color:var(--muted)}
  .steps li::before{content:counter(s);position:absolute;left:.4rem;top:.35rem;width:1.25rem;height:1.25rem;border-radius:50%;border:1px solid var(--line);font-size:.72rem;display:flex;align-items:center;justify-content:center;background:#fff}
  .steps li.active{background:var(--accent-bg);color:var(--ink);font-weight:600}
  .steps li.active::before{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav{display:flex;gap:.5rem;align-items:center;margin:.6rem 0 0}
  label.chk{display:flex;align-items:flex-start;gap:.5rem;font-size:.9rem;padding:.3rem 0;cursor:pointer}
  label.chk input{margin-top:.25rem;accent-color:var(--accent)}
  .bar{height:8px;border-radius:999px;background:#e9edf2;overflow:hidden;margin:.4rem 0}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<h1>Joins: which rows survive?</h1>
<p class="lead">A join lines up rows from two tables. The only real question is what happens to rows that have <b>no match</b> on the other side. Switch the join type and watch them appear and disappear.</p>
<div class="controls"><span class="lbl">Join type:</span><div class="pills" id="pick"></div></div>
<div class="wrap">
  <div class="col" style="flex:0 1 230px"><div class="card"><h2>customers</h2><table id="ta"></table></div></div>
  <div class="col" style="flex:0 1 290px"><div class="card"><h2>orders</h2><table id="tb"></table></div></div>
  <div class="col"><div class="panel"><h2>The question it answers</h2><p id="q" style="margin:0 0 .5rem"></p><pre id="sql"></pre></div></div>
</div>
<div class="card"><h2>Result <span class="tag info" id="n"></span></h2><table id="tr"></table><div id="v"></div></div>
<script>
const A=[[1,"Fulfillco"],[2,"BrightGear"],[3,"Nimbus Snacks"],[4,"O'Brien Retail"]];
const B=[[101,1,"$50.40"],[102,2,"$214.19"],[103,2,"$27.55"],[104,9,"$18.00"]];
const J={
 INNER:{q:"Which customers have orders, and what are they?",v:"Only matched pairs. Nimbus Snacks and O'Brien Retail vanish because they have no orders. Order 104 vanishes because customer 9 does not exist. If your report is missing customers, this is usually why.",kind:"info"},
 LEFT:{q:"Show me every customer, with their orders if they have any.",v:"Every customer stays. The two with no orders get NULL in the order columns. This is the join you want for 'customers who have never ordered': add WHERE o.id IS NULL.",kind:"good"},
 RIGHT:{q:"Show me every order, with its customer if there is one.",v:"Every order stays, including 104, whose customer is missing. It is the same as a LEFT JOIN with the tables swapped, which is why almost nobody writes RIGHT JOIN.",kind:"info"},
 "FULL OUTER":{q:"Show me everything from both sides, matched where possible.",v:"Nothing is dropped. Useful for finding mismatches in both directions at once, like when you are reconciling two systems.",kind:"good"}};
let j="INNER";const $=id=>document.getElementById(id);
function rows(){const out=[];const usedB=new Set();
  for(const a of A){const m=B.filter(b=>b[1]===a[0]);
    if(m.length)m.forEach(b=>{out.push([a,b]);usedB.add(b[0]);});
    else if(j==="LEFT"||j==="FULL OUTER")out.push([a,null]);}
  if(j==="RIGHT"||j==="FULL OUTER")for(const b of B)if(!usedB.has(b[0]))out.push([null,b]);
  if(j==="RIGHT")out.sort((x,y)=>x[1][0]-y[1][0]);return out;}
function draw(){$("pick").innerHTML=Object.keys(J).map(k=>`<button class="${k===j?"on":""}" data-k="${k}">${k}</button>`).join("");
  const r=rows();const ka=new Set(r.filter(x=>x[0]).map(x=>x[0][0])),kb=new Set(r.filter(x=>x[1]).map(x=>x[1][0]));
  $("ta").innerHTML="<tr><th>id</th><th>name</th></tr>"+A.map(a=>`<tr class="${ka.has(a[0])?"hit":""}" style="${ka.has(a[0])?"":"opacity:.4"}"><td>${a[0]}</td><td>${a[1]}</td></tr>`).join("");
  $("tb").innerHTML="<tr><th>id</th><th>customer_id</th><th>total</th></tr>"+B.map(b=>`<tr class="${kb.has(b[0])?"hit":""}" style="${kb.has(b[0])?"":"opacity:.4"}"><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join("");
  const N='<td class="null">NULL</td>';
  $("tr").innerHTML="<tr><th>c.id</th><th>c.name</th><th>o.id</th><th>o.total</th></tr>"+r.map(([a,b])=>`<tr>${a?`<td>${a[0]}</td><td>${a[1]}</td>`:N+N}${b?`<td>${b[0]}</td><td>${b[2]}</td>`:N+N}</tr>`).join("");
  $("n").textContent=r.length+" rows";$("q").textContent=J[j].q;
  $("sql").textContent=`SELECT c.id, c.name, o.id, o.total\nFROM customers c\n${j} JOIN orders o\n  ON o.customer_id = c.id;`;
  $("v").innerHTML=`<div class="verdict ${J[j].kind}">${J[j].v}</div>`;}
$("pick").onclick=e=>{const b=e.target.closest("button");if(b){j=b.dataset.k;draw();}};draw();
</script>
</body>
</html>
