<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One request, six checkpoints · Parsity</title>
<style>
  :root{--ink:#1b2330;--muted:#5b6675;--line:#e3e7ec;--bg:#fff;--panel:#f6f8fa;
        --accent:#2563eb;--accent-bg:#eef4ff;--good:#15803d;--good-bg:#e7f6ec;--warn:#b91c1c;--warn-bg:#fbe9e9;
        --amber:#b45309;--amber-bg:#fef3e2;--code-bg:#f4f6f8;}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);margin:0;padding:1.6rem;line-height:1.5}
  h1{font-size:1.5rem;margin:0 0 .3rem}
  h2{font-size:1.02rem;margin:0 0 .5rem}
  .lead{color:var(--muted);font-size:1.02rem;max-width:62rem;margin:0 0 1rem}
  .controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:0 0 1rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .controls .lbl{font-size:.85rem;color:var(--muted);margin-right:.2rem}
  .pills{display:flex;gap:.4rem;flex-wrap:wrap}
  button{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.4rem .8rem;border-radius:999px}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}
  .col{flex:1 1 320px;min-width:280px}
  .card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:.9rem 1rem;margin-bottom:.8rem}
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:.9rem 1rem;margin-bottom:.8rem}
  .flow{display:flex;gap:.4rem;flex-wrap:wrap;align-items:stretch;margin:0 0 1rem}
  .node{flex:1 1 96px;min-width:92px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:.5rem .55rem;font-size:.84rem;text-align:center;transition:all .15s}
  .node b{display:block;font-size:.82rem;overflow-wrap:anywhere}
  .node small{color:var(--muted)}
  .node.active{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .node.done{border-color:#b7dfc4;background:var(--good-bg)}
  .node.fail{border-color:#f0c4c4;background:var(--warn-bg)}
  .node.skip{opacity:.4}
  .arrow{align-self:center;color:var(--muted);font-size:.9rem}
  .tag{display:inline-block;padding:.05em .5em;border-radius:999px;font-size:.78rem;font-weight:600}
  .tag.good{color:var(--good);background:var(--good-bg)} .tag.bad{color:var(--warn);background:var(--warn-bg)}
  .tag.info{color:var(--accent);background:var(--accent-bg)} .tag.amber{color:var(--amber);background:var(--amber-bg)}
  .verdict{padding:.7rem .9rem;border-radius:10px;font-size:.95rem;margin:.6rem 0 0}
  .verdict.good{background:var(--good-bg);color:var(--good)} .verdict.bad{background:var(--warn-bg);color:var(--warn)}
  .verdict.info{background:var(--accent-bg);color:#1e40af}
  code,pre{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.86rem}
  code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.4rem 0;overflow:auto;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em}
  td.null{color:var(--warn);font-style:italic;background:var(--warn-bg)}
  tr.hit td{background:var(--accent-bg)}
  .muted{color:var(--muted)} .small{font-size:.86rem}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;padding:.35rem .5rem .35rem 2rem;position:relative;border-radius:8px;font-size:.9rem;cursor:pointer;color:var(--muted)}
  .steps li::before{content:counter(s);position:absolute;left:.4rem;top:.35rem;width:1.25rem;height:1.25rem;border-radius:50%;border:1px solid var(--line);font-size:.72rem;display:flex;align-items:center;justify-content:center;background:#fff}
  .steps li.active{background:var(--accent-bg);color:var(--ink);font-weight:600}
  .steps li.active::before{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav{display:flex;gap:.5rem;align-items:center;margin:.6rem 0 0}
  label.chk{display:flex;align-items:flex-start;gap:.5rem;font-size:.9rem;padding:.3rem 0;cursor:pointer}
  label.chk input{margin-top:.25rem;accent-color:var(--accent)}
  .bar{height:8px;border-radius:999px;background:#e9edf2;overflow:hidden;margin:.4rem 0}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<h1>One request, six checkpoints</h1>
<p class="lead">Every API request runs the same gauntlet. Each layer can stop it and answer early. Pick a request and watch where it stops, and which status code comes back. Knowing the layer tells you where to look.</p>
<div class="controls"><span class="lbl">Send:</span><div class="pills" id="pick"></div></div>
<pre id="req"></pre>
<div class="flow" id="flow"></div>
<div class="wrap">
  <div class="col"><div class="card"><h2 id="t"></h2><p id="d" style="margin:.2rem 0"></p><div id="v"></div></div></div>
  <div class="col" style="flex:0 1 300px"><div class="panel"><h2>What comes back</h2><pre id="res"></pre><div class="small muted" id="who"></div></div></div>
</div>
<script>
const L=[["Rate limit","Too many requests?"],["Authentication","Who are you?"],["Authorization","Are you allowed?"],["Validation","Is the input sane?"],["Handler","Do the work"],["Database","Read or write"]];
const C=[
 {k:"A valid request",req:'POST /orders\nAuthorization: Bearer <staff token>\n{"customerId": 2, "items": [{"productId": 3, "qty": 2}]}',stop:6,code:"201 Created",body:'{"orderId": 68, "total": 2755}',t:"It passes every layer",d:"Nothing stopped it, so the handler ran, the database saved the order and the response says what was created.",who:"Nobody is at fault. This is the path your tests cover first, and the one that breaks least.",good:true},
 {k:"No token",req:'POST /orders\n{"customerId": 2, "items": [...]}',stop:1,code:"401 Unauthorized",body:'{"error": "missing auth header"}',t:"Stopped at authentication",d:"The server cannot tell who is asking, so it refuses before reading the body. The handler and the database never run.",who:"The caller needs to log in. 401 means we do not know who you are."},
 {k:"Wrong role",req:'DELETE /customers/2\nAuthorization: Bearer <warehouse staff token>',stop:2,code:"403 Forbidden",body:'{"error": "forbidden"}',t:"Stopped at authorization",d:"The token is valid, so we know who this is. They are just not allowed to do this. Mixing up 401 and 403 is a common interview question and a common bug.",who:"The caller is known and is not permitted. Logging in again will not help."},
 {k:"Bad input",req:'POST /orders\nAuthorization: Bearer <staff token>\n{"customerId": 2, "items": [{"productId": 3, "qty": -5}]}',stop:3,code:"400 Bad Request",body:'{"error": "qty must be a positive integer"}',t:"Stopped at validation",d:"A negative quantity makes no sense. Rejecting it here keeps nonsense out of the handler and out of the database. Skipping this layer is how a search box takes down an API.",who:"The caller sent something invalid. The message should say exactly what to fix."},
 {k:"Record not there",req:'GET /orders/99999\nAuthorization: Bearer <staff token>',stop:5,code:"404 Not Found",body:'{"error": "not found"}',t:"The database had nothing",d:"Everything was valid. The handler asked the database for order 99999 and got zero rows. That is a normal answer, so it gets a 404, not an error.",who:"Nobody is at fault. The thing does not exist."},
 {k:"A bug in the handler",req:'POST /orders/7/ship\nAuthorization: Bearer <staff token>\n{}',stop:4,code:"500 Internal Server Error",body:'{"error": "internal error"}',t:"The handler threw",d:"The code assumed something that was not true and crashed. If nothing catches that error, one bad request can take the whole process down with it.",who:"This one is on the server. It is the only case here that belongs in your error tracker.",bug:true},
 {k:"The 500th request this minute",req:'GET /orders\nAuthorization: Bearer <staff token>',stop:0,code:"429 Too Many Requests",body:'{"error": "slow down"}\nRetry-After: 30',t:"Stopped at the front door",d:"The cheapest check runs first. A caller hammering the API is turned away before the server spends anything on them.",who:"The caller should wait and retry. A well-behaved client reads Retry-After."}
];
let c=0;const $=id=>document.getElementById(id);
function draw(){const x=C[c];
  $("pick").innerHTML=C.map((y,k)=>`<button class="${k===c?"on":""}" data-k="${k}">${y.k}</button>`).join("");
  $("req").textContent=x.req;
  $("flow").innerHTML=L.map((l,k)=>{let cls=k<x.stop?"done":k===x.stop?(x.good?"done":"fail"):"skip";if(x.k==="Record not there"&&k===5)cls="active";
    return `<div class="node ${cls}"><b>${l[0]}</b><small>${l[1]}</small></div>`+(k<L.length-1?'<div class="arrow">&rarr;</div>':"");}).join("");
  $("t").textContent=x.t;$("d").textContent=x.d;
  $("v").innerHTML=`<div class="verdict ${x.good?"good":x.bug?"bad":"info"}">${x.who}</div>`;
  $("res").textContent=x.code+"\n"+x.body;
  $("who").textContent=x.code[0]==="4"?"4xx: the caller has to change something.":x.code[0]==="5"?"5xx: the server has to change something.":"2xx: it worked.";}
$("pick").onclick=e=>{const b=e.target.closest("button");if(b){c=+b.dataset.k;draw();}};draw();
</script>
</body>
</html>
